name: erp-production

x-app-environment: &app-environment
  NODE_ENV: production
  DB_SCHEMA: erp
  DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
  JWT_SECRET: ${JWT_SECRET:?required}
  CORS_ORIGIN: ${CORS_ORIGIN:?required}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  PLATFORM_APPROVAL_EMAIL: ${PLATFORM_APPROVAL_EMAIL:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

services:
  migrate:
    build: { context: ., target: erp_api }
    command: ["node", "dist/apps/api/erp-api/db/migrate.js"]
    environment: *app-environment
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: erp_api }
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *app-environment
      PORT: 3333
      TRUST_PROXY: 1
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3333/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  worker:
    build: { context: ., target: worker }
    read_only: true
    tmpfs: ["/tmp"]
    environment: *app-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  web:
    build: { context: ., target: erp_web }
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  test:
    profiles: ["test"]
    build: { context: ., target: build }
    command: ["sh", "-c", "npm run db:seed && npm run db:seed:storefront && npx nx run-many -t test --projects=erp_api,worker,jobs-core,jobs-producers,jobs-processors,commerce-catalog-contracts,commerce-catalog-application"]
    environment:
      <<: *app-environment
      NODE_ENV: test
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?required}" }
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { ERP_DOMAIN: "${ERP_DOMAIN:?required}" }
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-camera-agent"
version = "0.1.0"
description = "Camera-side people counting and Vision Service event publisher"
requires-python = ">=3.12"
dependencies = [
  "opencv-python>=4.10",
  "requests>=2.32",
  "ultralytics>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]
